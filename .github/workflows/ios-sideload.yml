name: Build iPhone IPA (Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BydAutoLock/**'
      - 'project*.yml'
      - '.github/workflows/ios-sideload.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iPhone build project
        run: xcodegen generate --spec project.sideload.yml
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project BydAutoLock.xcodeproj -scheme Sideload \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' build 2>&1 | tee build/xcodebuild.log
      - name: Show compiler errors
        if: failure()
        run: |
          if [ -f build/xcodebuild.log ]; then
            echo '### iPhone build errors' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -n -B 3 -A 8 -E 'error:|fatal error:|BUILD FAILED|The following build commands failed' build/xcodebuild.log | head -200 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-build-failure-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BYDAutoLock.app build/ipa/Payload/
          test ! -d build/ipa/Payload/BYDAutoLock.app/Watch
          test ! -d build/ipa/Payload/BYDAutoLock.app/PlugIns
          cd build/ipa
          /usr/bin/zip -qry ../BydAutoLock-Sideloadly.ipa Payload
          /usr/bin/unzip -t ../BydAutoLock-Sideloadly.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: BydAutoLock-Sideloadly
          path: build/BydAutoLock-Sideloadly.ipa
          if-no-files-found: error
          retention-days: 14
